[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

[[headers]]
  for = "/viewer.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/index.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/index.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"


# GitHub Releases same-origin proxy for SOG test assets.
# Browser requests /github-release/<tag>/<filename> from this Netlify site;
# Netlify proxies it upstream, avoiding browser CORS against github.com.
[[redirects]]
  from = "/github-release/*"
  to = "https://github.com/aiclass00001-debug/supersplat-kiri-bridge/releases/download/:splat"
  status = 200
  force = true
